<svg xmlns="http://www.w3.org/2000/svg" width="480" height="222" viewBox="0 0 480 222" role="img" aria-label="~/samncg/languages">
  <title>~/samncg/languages</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; white-space: pre; fill: #4a4a4a; }
    .ink { fill: #121212; } .faint { fill: #9a9a9a; } .accent { fill: #3c2899; }
    .title { fill: #121212; font-weight: 700; font-size: 13.5px; }
    .row { opacity: 0; animation: in .6s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="479" height="221" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="22" y="34">~/samncg/languages</text>
  <g class="row" style="animation-delay:0.00s"><text x="22" y="66"><tspan class="ink">Python      </tspan> <tspan class="faint">[</tspan><tspan class="accent">######################</tspan><tspan class="faint">]</tspan>  29.7%</text></g>
  <g class="row" style="animation-delay:0.08s"><text x="22" y="87"><tspan class="ink">JavaScript  </tspan> <tspan class="faint">[</tspan><tspan class="ink">#############</tspan><tspan class="faint">---------]</tspan>  17.8%</text></g>
  <g class="row" style="animation-delay:0.16s"><text x="22" y="108"><tspan class="ink">Kotlin      </tspan> <tspan class="faint">[</tspan><tspan class="ink">############</tspan><tspan class="faint">----------]</tspan>  15.9%</text></g>
  <g class="row" style="animation-delay:0.24s"><text x="22" y="129"><tspan class="ink">HTML        </tspan> <tspan class="faint">[</tspan><tspan class="ink">##########</tspan><tspan class="faint">------------]</tspan>  13.0%</text></g>
  <g class="row" style="animation-delay:0.32s"><text x="22" y="150"><tspan class="ink">Java        </tspan> <tspan class="faint">[</tspan><tspan class="ink">#######</tspan><tspan class="faint">---------------]</tspan>  10.0%</text></g>
  <g class="row" style="animation-delay:0.40s"><text x="22" y="171"><tspan class="ink">TypeScript  </tspan> <tspan class="faint">[</tspan><tspan class="ink">#######</tspan><tspan class="faint">---------------]</tspan>   8.9%</text></g>
  <g class="row" style="animation-delay:0.48s"><text x="22" y="192"><tspan class="ink">CSS         </tspan> <tspan class="faint">[</tspan><tspan class="ink">###</tspan><tspan class="faint">-------------------]</tspan>   3.9%</text></g>
</svg>
