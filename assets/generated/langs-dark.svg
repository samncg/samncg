<svg xmlns="http://www.w3.org/2000/svg" width="480" height="222" viewBox="0 0 480 222" role="img" aria-label="~/samncg/languages">
  <title>~/samncg/languages</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; white-space: pre; fill: #a3a3a3; }
    .ink { fill: #ededed; } .faint { fill: #5a5a5a; } .accent { fill: #c4b2ff; }
    .title { fill: #ededed; font-weight: 700; font-size: 13.5px; }
    .row { opacity: 0; animation: in .6s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="479" height="221" rx="10" fill="#000000" stroke="#262626"/>
  <text class="title" x="22" y="34">~/samncg/languages</text>
  <g class="row" style="animation-delay:0.00s"><text x="22" y="66"><tspan class="ink">Python      </tspan> <tspan class="faint">[</tspan><tspan class="accent">######################</tspan><tspan class="faint">]</tspan>  33.0%</text></g>
  <g class="row" style="animation-delay:0.08s"><text x="22" y="87"><tspan class="ink">JavaScript  </tspan> <tspan class="faint">[</tspan><tspan class="ink">#############</tspan><tspan class="faint">---------]</tspan>  19.8%</text></g>
  <g class="row" style="animation-delay:0.16s"><text x="22" y="108"><tspan class="ink">Kotlin      </tspan> <tspan class="faint">[</tspan><tspan class="ink">############</tspan><tspan class="faint">----------]</tspan>  17.7%</text></g>
  <g class="row" style="animation-delay:0.24s"><text x="22" y="129"><tspan class="ink">HTML        </tspan> <tspan class="faint">[</tspan><tspan class="ink">##########</tspan><tspan class="faint">------------]</tspan>  14.4%</text></g>
  <g class="row" style="animation-delay:0.32s"><text x="22" y="150"><tspan class="ink">Java        </tspan> <tspan class="faint">[</tspan><tspan class="ink">#######</tspan><tspan class="faint">---------------]</tspan>  11.1%</text></g>
  <g class="row" style="animation-delay:0.40s"><text x="22" y="171"><tspan class="ink">CSS         </tspan> <tspan class="faint">[</tspan><tspan class="ink">##</tspan><tspan class="faint">--------------------]</tspan>   3.2%</text></g>
  <g class="row" style="animation-delay:0.48s"><text x="22" y="192"><tspan class="ink">Rust        </tspan> <tspan class="faint">[</tspan><tspan class="ink">#</tspan><tspan class="faint">---------------------]</tspan>   0.5%</text></g>
</svg>
